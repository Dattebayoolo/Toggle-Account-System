  </defs>
  <rect x="4" y="12" width="40" height="24" rx="12" fill="url(#toggle-track)"/>
  <circle cx="31" cy="25.5" r="8.5" fill="rgba(20,20,20,0.25)"/>
  <circle cx="30" cy="24" r="8.5" fill="#ffffff" filter="url(#knob-shadow)"/>
  <circle cx="30" cy="24" r="3" fill="#4285f4"/>
